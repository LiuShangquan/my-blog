name: Deploy Hexo to Aliyun OSS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    env:
      # 固定版本避免上游变更导致工作流不稳定；需要升级时修改这里即可
      OSSUTIL_VERSION: 1.7.16
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Install ossutil
        run: |
          curl -sSL "https://gosspublic.alicdn.com/ossutil/${OSSUTIL_VERSION}/ossutil64" -o ossutil
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/ossutil

      - name: Upload to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          OSSUTIL_CONFIG_FILE="/tmp/.ossutilconfig"
          ossutil config -e "${OSS_ENDPOINT}" -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" -L CH --config-file "${OSSUTIL_CONFIG_FILE}"
          ossutil cp -rf public/ "oss://${OSS_BUCKET}/" --update
          rm -f "${OSSUTIL_CONFIG_FILE}"

      - name: Install Aliyun CLI
        run: |
          curl -sSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun.tgz
          tar -xzf aliyun.tgz
          sudo mv aliyun /usr/local/bin/aliyun

      - name: Refresh CDN cache
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_REGION_ID: ${{ secrets.ALIYUN_REGION_ID }}
          ALIYUN_CDN_OBJECT_PATHS: ${{ secrets.ALIYUN_CDN_OBJECT_PATHS }}
        run: |
          if [ -z "${ALIYUN_CDN_OBJECT_PATHS}" ]; then
            echo "ALIYUN_CDN_OBJECT_PATHS 未配置，跳过 CDN 刷新"
            exit 0
          fi
          aliyun configure set \
            --mode AK \
            --region "${ALIYUN_REGION_ID}" \
            --access-key-id "${ALIYUN_ACCESS_KEY_ID}" \
            --access-key-secret "${ALIYUN_ACCESS_KEY_SECRET}"
          while IFS= read -r object_path; do
            object_type="File"
            case "${object_path}" in
              */) object_type="Directory" ;;
            esac
            aliyun cdn RefreshObjectCaches --ObjectPath "${object_path}" --ObjectType "${object_type}"
          done <<EOF
          ${ALIYUN_CDN_OBJECT_PATHS}
          EOF
