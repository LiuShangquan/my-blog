backend:
  name: github
  repo: LiuShangquan/my-blog
  branch: main
  # 替换为你的 OAuth 代理地址（例如 Netlify Functions / 自建 OAuth 服务入口）
  # 示例：https://xxx.netlify.app/.netlify/functions
  base_url: https://YOUR_OAUTH_PROXY_DOMAIN
  auth_endpoint: auth

local_backend: true
# 替换为你的博客正式访问地址（生产环境 URL）
site_url: https://YOUR_BLOG_DOMAIN
display_url: https://YOUR_BLOG_DOMAIN
logo_url: /favicon.ico

media_folder: source/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: 博客文章
    label_singular: 文章
    folder: source/_posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 发布时间, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss" }
      - { label: 更新时间, name: updated, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", required: false }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 分类, name: categories, widget: list, required: false }
      - { label: 是否草稿, name: draft, widget: boolean, required: false, default: false }
      - { label: 正文, name: body, widget: markdown }
